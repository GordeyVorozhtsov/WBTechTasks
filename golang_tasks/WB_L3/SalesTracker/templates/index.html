<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalesTracker</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f5f5f5; margin:0; padding:0; }
    header { background: #2563eb; color: #fff; padding: 1rem 2rem; }
    h1 { margin:0; font-size:1.5rem; }
    main { max-width:900px; margin:2rem auto; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
    form { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:2rem; }
    input, select, button, textarea { padding:0.5rem; font-size:1rem; border:1px solid #ccc; border-radius:8px; }
    button { background-color:#2563eb; color:white; cursor:pointer; border:none; transition:background-color 0.2s; }
    button:hover { background-color:#1d4ed8; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { border-bottom:1px solid #e5e5e5; padding:0.6rem; text-align:left; }
    th { background-color:#f9fafb; }
    .income { color:green; font-weight:600; }
    .expense { color:red; font-weight:600; }
    .actions button { background:#ef4444; border:none; padding:0.3rem 0.6rem; color:#fff; border-radius:6px; cursor:pointer; }
    .actions button:hover { background:#dc2626; }
    .analytics { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-top:2rem; text-align:center; }
    .card { background:#f3f4f6; padding:1rem; border-radius:8px; }
    .card h3 { margin:0; font-size:1.2rem; color:#374151; }
    .card p { margin:0.3rem 0 0; font-size:1.2rem; font-weight:600; color:#111827; }
  </style>
</head>
<body>
  <header>
    <h1>💰 SalesTracker</h1>
  </header>
  <main>
    <h2>Добавить запись</h2>
    <form id="itemForm">
      <select name="type" required>
        <option value="income">Доход</option>
        <option value="expense">Расход</option>
      </select>
      <input name="amount" type="number" step="0.01" placeholder="Сумма" required />
      <input name="category" type="text" placeholder="Категория" required />
      <input name="note" type="text" placeholder="Заметка" />
      <input name="occurred_at" type="datetime-local" required />
      <button type="submit">Добавить</button>
    </form>

    <h2>Записи</h2>
    <table id="itemsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Тип</th>
          <th>Сумма</th>
          <th>Категория</th>
          <th>Заметка</th>
          <th>Дата</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <section class="analytics" id="analytics">
      <div class="card"><h3>Всего</h3><p id="sum">0</p></div>
      <div class="card"><h3>Среднее</h3><p id="avg">0</p></div>
      <div class="card"><h3>Количество</h3><p id="count">0</p></div>
      <div class="card"><h3>Медиана</h3><p id="median">0</p></div>
      <div class="card"><h3>90 перцентиль</h3><p id="p90">0</p></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("itemForm");
    const tbody = document.querySelector("#itemsTable tbody");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      data.amount = parseFloat(data.amount);
      data.occurred_at = new Date(data.occurred_at).toISOString();

      const res = await fetch("/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const err = await res.json();
        alert("Ошибка: " + (err.error || "неизвестная ошибка"));
        return;
      }

      form.reset();
      await loadData();
    });

    async function loadData() {
      const res = await fetch("/items");
      const items = await res.json();
      tbody.innerHTML = "";
      for (const it of items) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${it.id}</td>
          <td class="${it.type}">${it.type}</td>
          <td>${parseFloat(it.amount).toFixed(2)}</td>
          <td>${it.category}</td>
          <td>${it.note ?? ""}</td>
          <td>${new Date(it.occurred_at).toLocaleString()}</td>
          <td class="actions"><button onclick="del(${it.id})">×</button></td>
        `;
        tbody.appendChild(tr);
      }
      await loadAnalytics();
    }

    async function del(id) {
      if (!confirm("Удалить запись #" + id + "?")) return;
      await fetch("/items/" + id, { method: "DELETE" });
      await loadData();
    }

    async function loadAnalytics() {
      const from = "2025-11-01";
      const to = "2025-11-30";

      const res = await fetch(`/analytics?from=${from}&to=${to}`);
      const data = await res.json();
      document.getElementById("sum").textContent = parseFloat(data.total).toFixed(2);
      document.getElementById("avg").textContent = parseFloat(data.average).toFixed(2);
      document.getElementById("count").textContent = data.count;
      document.getElementById("median").textContent = parseFloat(data.median).toFixed(2);
      document.getElementById("p90").textContent = parseFloat(data.p90).toFixed(2);
    }

    loadData();
  </script>
</body>
</html>
